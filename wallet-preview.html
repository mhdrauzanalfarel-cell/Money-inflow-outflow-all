<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wallet Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e0e0e0;font-family:'Space Mono',monospace;min-height:100vh;padding:20px 16px}
  .title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:#00FFB3}
  .subtitle{font-size:10px;color:#444;letter-spacing:2px;margin-top:2px;margin-bottom:20px}
  .wallet-card{background:#111318;border:1px solid #1e2028;border-radius:16px;padding:20px;margin-bottom:14px}
  .wallet-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .wallet-name-left{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .token-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #15181f}
  .token-row:last-child{border-bottom:none}
  .token-left{display:flex;align-items:center;gap:12px}
  .token-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
  .token-name{font-size:13px;font-weight:700;color:#e0e0e0}
  .token-price-idr{font-size:10px;color:#555;margin-top:3px}
  .token-right{text-align:right}
  .token-total-idr{font-size:14px;font-weight:700;color:#00FFB3}
  .token-amount{font-size:10px;color:#555;margin-top:3px}
  .total-bar{background:#0d0f14;border:1px solid #1e2028;border-radius:12px;padding:16px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .total-label{font-size:10px;color:#555;letter-spacing:2px}
  .total-value{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#00FFB3}
  .total-usd{font-size:10px;color:#555;margin-top:2px;text-align:right}
  .refresh-btn{background:none;border:1px solid #2a2d35;border-radius:8px;color:#888;padding:8px 14px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;margin-bottom:16px}
  .loading{color:#555;font-size:11px;text-align:center;padding:20px}
  .up{color:#00FFB3;font-size:10px}
  .down{color:#FF6B6B;font-size:10px}
  .update-time{font-size:10px;color:#333;margin-top:4px}
  .err{color:#FF6B6B;font-size:11px;padding:16px;background:#FF6B6B10;border-radius:8px;margin-bottom:12px;line-height:1.6}
</style>
</head>
<body>

<div class="title">WALLET TRACKER</div>
<div class="subtitle">HARGA REAL-TIME · IDR</div>

<button class="refresh-btn" onclick="fetchPrices()">⟳ REFRESH HARGA</button>

<div class="total-bar">
  <div>
    <div class="total-label">TOTAL PORTFOLIO</div>
    <div class="update-time" id="update-time"></div>
  </div>
  <div>
    <div class="total-value" id="total-idr">—</div>
    <div class="total-usd" id="total-usd"></div>
  </div>
</div>

<div id="container"><div class="loading">Mengambil harga...</div></div>

<script>
const API_KEY = "CG-dYDH4jKCbFvhdXdfUat7pSgL";

const WALLETS = [
  {
    name: "Wallet A - Akun 01",
    color: "#00FFB3",
    tokens: [
      { id: "bitcoin",  sym: "BTC",  amount: 0.000003 },
      { id: "ethereum", sym: "ETH",  amount: 0.000033 },
      { id: "tether",   sym: "USDT", amount: 0.08 },
    ]
  },
  {
    name: "Wallet B",
    color: "#FF6B6B",
    tokens: [
      { id: "bitcoin",  sym: "BTC", amount: 0.0001 },
      { id: "ethereum", sym: "ETH", amount: 0.005 },
    ]
  }
];

const ICONS = {
  BTC:  { icon:"₿", bg:"#F7931A25", color:"#F7931A" },
  ETH:  { icon:"Ξ", bg:"#627EEA25", color:"#627EEA" },
  USDT: { icon:"₮", bg:"#26A17B25", color:"#26A17B" },
  BNB:  { icon:"◈", bg:"#F3BA2F25", color:"#F3BA2F" },
  SOL:  { icon:"◎", bg:"#9945FF25", color:"#9945FF" },
};

function fmtIDR(n) {
  if(n >= 1e9) return 'Rp ' + (n/1e9).toFixed(2) + ' M';
  if(n >= 1e6) return 'Rp ' + (n/1e6).toFixed(2) + ' jt';
  if(n >= 1e3) return 'Rp ' + (n/1e3).toFixed(1) + ' rb';
  return 'Rp ' + n.toFixed(0);
}
function fmtIDRFull(n) {
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

async function fetchPrices() {
  document.getElementById('container').innerHTML = '<div class="loading">Mengambil harga...</div>';
  const ids = [...new Set(WALLETS.flatMap(w => w.tokens.map(t => t.id)))].join(',');
  const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=idr,usd&include_24hr_change=true&x_cg_demo_api_key=${API_KEY}`;

  try {
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('container').innerHTML =
      `<div class="err">⚠️ Gagal ambil harga.<br><small>${e.message}</small><br><br>Tap ⟳ Refresh untuk coba lagi.</div>`;
  }
}

function render(data) {
  let totalIDR = 0, totalUSD = 0;
  let html = '';

  WALLETS.forEach(wallet => {
    let walletIDR = 0;
    let tokensHtml = '';

    wallet.tokens.forEach(token => {
      const p = data[token.id];
      if(!p) return;
      const priceIDR = p.idr;
      const priceUSD = p.usd;
      const change = p.usd_24h_change || 0;
      const totalTokenIDR = priceIDR * token.amount;
      const totalTokenUSD = priceUSD * token.amount;
      walletIDR += totalTokenIDR;
      const ic = ICONS[token.sym] || { icon:'◆', bg:'#ffffff10', color:'#888' };

      tokensHtml += `
        <div class="token-row">
          <div class="token-left">
            <div class="token-icon" style="background:${ic.bg};color:${ic.color}">${ic.icon}</div>
            <div>
              <div class="token-name">${token.sym}</div>
              <div class="token-price-idr">
                ${fmtIDRFull(priceIDR)}/koin
                <span class="${change>=0?'up':'down'}">&nbsp;${change>=0?'▲':'▼'}${Math.abs(change).toFixed(2)}%</span>
              </div>
            </div>
          </div>
          <div class="token-right">
            <div class="token-total-idr">${fmtIDR(totalTokenIDR)}</div>
            <div class="token-amount">${token.amount} ${token.sym} · $${totalTokenUSD.toFixed(4)}</div>
          </div>
        </div>`;
    });

    totalIDR += walletIDR;
    totalUSD += wallet.tokens.reduce((s,t) => s + (data[t.id]?.usd||0)*t.amount, 0);

    html += `
      <div class="wallet-card">
        <div class="wallet-name">
          <div class="wallet-name-left">
            <div class="dot" style="background:${wallet.color}"></div>
            ${wallet.name}
          </div>
          <span style="color:#00FFB3">${fmtIDR(walletIDR)}</span>
        </div>
        ${tokensHtml}
      </div>`;
  });

  document.getElementById('container').innerHTML = html;
  document.getElementById('total-idr').textContent = fmtIDRFull(totalIDR);
  document.getElementById('total-usd').textContent = '$' + totalUSD.toFixed(4);
  document.getElementById('update-time').textContent = 'Update: ' + new Date().toLocaleTimeString('id-ID');
}

fetchPrices();
setInterval(fetchPrices, 60000);
</script>
</body>
</html>
